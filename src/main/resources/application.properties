# Petsave API Configuration
spring.application.name=petsave
server.port=8080

# --- Performance Optimizations ---
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true

# --- PostgreSQL Database Config ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Database Connection Pooling ---
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# --- Tomcat Thread Pool ---
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4

# --- JPA ---
spring.jpa.open-in-view=false

# --- Hibernate Performance ---
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# --- Caching ---
spring.cache.type=simple
spring.cache.cache-names=users,adoptions,donations

# Paystack
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.public.key=${PAYSTACK_PUBLIC_KEY}

# Cloudinary
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# Email (Brevo - HTTPS API, works on Railway)
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:noreply@petsave.com}
brevo.from.name=PetSave
app.frontend.url=https://petsave-frontend.vercel.app
app.admin.email=${MAIL_USERNAME:admin@petsave.com}

# Keep mail properties to satisfy spring-boot-starter-mail auto-config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.com.petsave=WARN

# --- Production Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true

# --- Rate Limiting (Simple Implementation) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

JWT_SECRET_KEY=${JWT_SECRET_KEY}